name: release-image

# Builds and pushes the multi-arch nomad-server image to GHCR.
# Trigger: push a git tag `vX.Y.Z` (image gets X.Y.Z), or manual dispatch.
#
# After a release, pin the printed multi-arch index digest in
# infra/umbrel/nomad-server/docker-compose.yml and sync the package to the
# app-store repo (see infra/README.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nomad-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          # plain multi-arch index: keeps digest pinning for Umbrel simple
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Multi-arch index digest (pin this in the Umbrel package)
        run: echo "digest=${{ steps.build.outputs.digest }}"
